# Test environment: app + its own PostgreSQL. No shared database with any other system.
# Works with plain `docker compose` and as a Coolify "Docker Compose" application:
#   - without a domain the app is published only on APP_BIND:APP_PORT (a private address);
#     with a domain in Coolify ("https://<name>:3000") the public path goes through Coolify's proxy
#     (HTTPS), and then BASIC_AUTH_USER and COOKIE_SECURE=true are required (README);
#   - every variable below shows up in Coolify's Environment Variables;
#     SERVICE_PASSWORD_* are Coolify's generated secrets (set them yourself elsewhere):
#     POSTGRES = table owner (migrations), APP = the server's role, SEED = test users;
#   - the test seed runs at every start when SEED_TEST_PASSWORD is set (idempotent);
#   - backups: run `caparium-backup` in the db container (a Coolify scheduled task),
#     dumps land in the db-backups volume, each one restore-checked.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: caparium
      POSTGRES_USER: caparium
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES:?set SERVICE_PASSWORD_POSTGRES}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - db-data:/var/lib/postgresql/data
      - db-backups:/backups
      - ./scripts/db-backup.sh:/usr/local/bin/caparium-backup:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caparium -d caparium"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    environment:
      # migrations and seed as the table owner, the server as caparium_app (scripts/start.sh)
      MIGRATE_DATABASE_URL: postgresql://caparium:${SERVICE_PASSWORD_POSTGRES}@db:5432/caparium
      DATABASE_URL: postgresql://caparium_app:${SERVICE_PASSWORD_APP:?set SERVICE_PASSWORD_APP}@db:5432/caparium
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # the basic-auth gate before every path (src/proxy.ts); empty = off (local, CI).
      # Public test site: BASIC_AUTH_USER set in Coolify, the password generated by Coolify.
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_PASSWORD: ${SERVICE_PASSWORD_BASICAUTH:-}
      SEED_TEST_PASSWORD: ${SERVICE_PASSWORD_SEED:-}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 12

volumes:
  db-data:
  db-backups:
